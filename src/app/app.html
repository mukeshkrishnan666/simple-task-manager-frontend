<mat-toolbar color="primary" class="app-toolbar">
  <mat-icon>task_alt</mat-icon>
  <span class="toolbar-title">Task Manager</span>
  <span class="spacer"></span>
  <a mat-button href="http://localhost:8080/swagger-ui.html" target="_blank">
    <mat-icon>api</mat-icon>
    Swagger Docs
  </a>
  <a mat-button href="http://localhost:8080/h2-console" target="_blank">
    <mat-icon>storage</mat-icon>
    H2 Console
  </a>
</mat-toolbar>

<main class="main-container">
  <div class="content-wrapper">
    <app-task-form (taskCreated)="onTaskCreated()"></app-task-form>
    <app-task-list #taskList></app-task-list>
  </div>
</main>
